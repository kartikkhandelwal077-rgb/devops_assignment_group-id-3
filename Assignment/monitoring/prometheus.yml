global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'devops-microservice'
    metrics_path: '/api/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['web:5000']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
