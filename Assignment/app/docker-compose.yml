version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - ENVIRONMENT=development
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - devops-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge

volumes:
  redis-data:
